[tool.poetry]
name = "virtual-contributor-engine-guidance"
version = "0.16.0"
description = "Alkemio Generative AI Guidance Engine"
authors = ["Alkemio BV <info@alkem.io>"]
license = "EUPL-1.2"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
langchain = "^1.1.0"
langchain-core = "^1.1.0"
python-dotenv = "1.1.1"
faiss-cpu = "1.12.0"
openai = "2.2.0"
load-dotenv = "0.1.0"
beautifulsoup4 = "4.14.2"
async-timeout = "5.0.1"
aio-pika = "9.5.7"
aiormq = "6.9.0"
tiktoken = "0.12.0"
gitpython = "3.1.45"
bcrypt = "^5.0.0"
alkemio-virtual-contributor-engine = {git = "https://git@github.com/alkem-io/virtual-contributor-engine.git", tag = "v0.7.0"}


[tool.poetry.group.dev.dependencies]
flake8 = "7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

